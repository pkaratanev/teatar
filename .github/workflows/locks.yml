name: Lock files

# Run by hand: resolves backend/composer.lock and mobile/package-lock.json from the version ranges in
# composer.json / package.json and commits them to main (the cloud sandbox can't reach Packagist or npm).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pdo_sqlite, intl, exif, gd
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: composer.lock
        working-directory: backend
        run: composer update --no-interaction --no-progress --no-install
      - name: package-lock.json
        working-directory: mobile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/composer.lock mobile/package-lock.json
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Add lock files (generated by the Lock files workflow)"
          git push
