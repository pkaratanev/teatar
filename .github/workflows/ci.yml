name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teatar
          POSTGRES_USER: teatar
          POSTGRES_PASSWORD: teatar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teatar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: teatar
      DB_USERNAME: teatar
      DB_PASSWORD: teatar
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, exif, gd
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan filament:assets
          test -f public/js/filament/filament/app.js || { echo "::error::Filament assets were not published"; exit 1; }
      - name: Code style
        run: vendor/bin/pint --test
        continue-on-error: true # becomes blocking once the scaffold has been run through pint locally
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github
      - name: Migrate (Postgres, with pg_trgm)
        run: php artisan migrate --force
      - name: Tests
        run: php artisan test --log-junit junit.xml
      - name: Test failures as annotations
        if: failure() && hashFiles('backend/junit.xml') != ''
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for tc in ET.parse('junit.xml').iter('testcase'):
              for f in list(tc.iter('failure')) + list(tc.iter('error')):
                  msg = (f.text or f.get('message') or '').strip().replace('\n', '%0A')[:1500]
                  print(f"::error title={tc.get('name')}::{msg}")
          PY

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        # Errors are echoed as annotations so they are readable without downloading logs.
        run: |
          npm install --no-audit --no-fund > npm.log 2>&1 || { grep -E "npm (error|ERR)" npm.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Typecheck
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false | sed -E 's/^(.+)\(([0-9]+),[0-9]+\): error (.*)$/::error file=mobile\/\1,line=\2::\3/'
        shell: bash
