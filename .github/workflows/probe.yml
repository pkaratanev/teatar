name: Probe sites
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: fetch
        run: |
          mkdir out; cd out
          UA=$(grep -oP "user_agent'\s*=>\s*env\('[A-Z_]+',\s*'\K[^']+" ../backend/config/teatar.php || echo "TeatarBot/0.1")
          echo "$UA" > ua.txt
          f() { curl -sSL -m 30 -A "$UA" -H 'Accept-Language: bg' -o "$1" -w "$1 %{http_code} %{url_effective}\n" "$2" >> index.txt 2>&1 || echo "$1 FAIL $2" >> index.txt; }
          f vnp-contacts.html "https://vnpuppet.com/%D0%BA%D0%BE%D0%BD%D1%82%D0%B0%D0%BA%D1%82%D0%B8/"
          f geo-vnp.json "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=bg&limit=5&q=%D0%BA%D1%83%D0%BA%D0%BB%D0%B5%D0%BD%20%D1%82%D0%B5%D0%B0%D1%82%D1%8A%D1%80%2C%20%D0%92%D0%B0%D1%80%D0%BD%D0%B0"; sleep 2
          f geo-vnp2.json "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=bg&limit=5&amenity=theatre&city=%D0%92%D0%B0%D1%80%D0%BD%D0%B0"; sleep 2
          f geo-mlt.json "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=bg&limit=5&q=%D0%9C%D0%BB%D0%B0%D0%B4%D0%B5%D0%B6%D0%BA%D0%B8%20%D1%82%D0%B5%D0%B0%D1%82%D1%8A%D1%80%20%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%91%D0%B8%D0%BD%D0%B5%D0%B2"; sleep 2
          f geo-mlt2.json "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=bg&limit=5&street=8%20%D0%B1%D1%83%D0%BB.%20%D0%9A%D0%BD%D1%8F%D0%B7%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%8A%D1%80%20%D0%94%D0%BE%D0%BD%D0%B4%D1%83%D0%BA%D0%BE%D0%B2&city=%D0%A1%D0%BE%D1%84%D0%B8%D1%8F"; sleep 2
          f geo-vaz.json "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=bg&limit=5&q=%D0%A2%D0%B5%D0%B0%D1%82%D1%8A%D1%80%20%D0%92%D1%8A%D0%B7%D1%80%D0%B0%D0%B6%D0%B4%D0%B0%D0%BD%D0%B5%2C%20%D0%A1%D0%BE%D1%84%D0%B8%D1%8F"; sleep 2
      - name: publish
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-out; git rm -rqf --cached .; git add -f out
          git commit -qm out; git push -f origin probe-out
