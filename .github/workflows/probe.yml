name: Probe sites
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: fetch
        run: |
          mkdir out; cd out
          UA=$(grep -oP "user_agent'\s*=>\s*env\('[A-Z_]+',\s*'\K[^']+" ../backend/config/teatar.php || echo "TeatarBot/0.1")
          echo "$UA" > ua.txt
          f() { curl -sSL -m 30 -A "$UA" -H 'Accept-Language: bg' -o "$1" -w "$1 %{http_code} %{url_effective}\n" "$2" >> index.txt 2>&1 || echo "$1 FAIL $2" >> index.txt; }
          f nat-robots.txt "https://nationaltheatre.bg/robots.txt"
          f nat-1.html "https://nationaltheatre.bg/bg/predstavlenie/ariya-na-spernicata"
          f nat-2.html "https://nationaltheatre.bg/bg/predstavlenie/az-plasham"
          f nat-3.html "https://nationaltheatre.bg/bg/predstavlenie/venecianskiyat-targovec"
          f t199-robots.txt "https://theatre199.org/robots.txt"
          f t199-1.html "https://theatre199.org/bg/plays/p/432-vecheren-akt"
          f t199-2.html "https://theatre199.org/bg/plays/p/624-godinata-na-magicheskoto-mislene-theatre199"
          f t199-3.html "https://theatre199.org/bg/plays/p/654-prizemena-theatre199"
          f sat-robots.txt "https://satirata.bg/robots.txt"
          f sat-1.html "https://satirata.bg/show/tom-i-huk"
          f sat-2.html "https://satirata.bg/show/primadoni"
          f sat-3.html "https://satirata.bg/show/zhenata-pita-chatgpt"
          f sof-robots.txt "https://sofiatheatre.eu/robots.txt"
          f sof-1.html "https://sofiatheatre.eu/repertoires/118/lyubov-i-drugi-avarii"
          f sof-2.html "https://sofiatheatre.eu/repertoires/120/uroci"
          f sof-3.html "https://sofiatheatre.eu/repertoires/264/uzasnite-roditeli"
          f ss-robots.txt "https://www.salzaismyah.bg/robots.txt"
          f ss-1.html "https://www.salzaismyah.bg/site/play/228"
          f ss-2.html "https://www.salzaismyah.bg/site/play/527"
          f ss-3.html "https://www.salzaismyah.bg/site/play/716"
          f dv-robots.txt "https://dramavarna.com/robots.txt"
          f dv-1.html "https://dramavarna.com/index.php/bg/program-and-tickets?event=953"
          f dv-2.html "https://dramavarna.com/index.php/bg/program-and-tickets?event=955"
          f dv-3.html "https://dramavarna.com/index.php/bg/program-and-tickets?event=957"
      - name: publish
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-out; git rm -rqf --cached .; git add -f out
          git commit -qm out; git push -f origin probe-out
