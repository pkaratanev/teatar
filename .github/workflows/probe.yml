name: Probe sites
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: fetch
        run: |
          mkdir out; cd out
          UA=$(grep -oP "user_agent'\s*=>\s*env\('[A-Z_]+',\s*'\K[^']+" ../backend/config/teatar.php || echo "TeatarBot/0.1")
          echo "$UA" > ua.txt
          f() { curl -sSL -m 30 -A "$UA" -H 'Accept-Language: bg' -o "$1" -w "$1 %{http_code} %{url_effective}\n" "$2" >> index.txt 2>&1 || echo "$1 FAIL $2" >> index.txt; }
          f vaz-robots.txt "https://theatrevazrajdane.bg/robots.txt"
          f vaz-1.html "https://theatrevazrajdane.bg/portfolio/%d0%b8%d0%b2%d0%b0%d0%bd%d0%be%d0%b2/"
          f vaz-2.html "https://theatrevazrajdane.bg/portfolio/%d0%ba%d0%b2%d0%b0%d1%80%d1%82%d0%b5%d1%82-%d0%b7%d0%b0-%d0%b4%d0%b2%d0%b0%d0%bc%d0%b0/"
          f vaz-3.html "https://theatrevazrajdane.bg/portfolio/%d1%82%d0%b5-%d0%b1%d1%8f%d1%85%d0%b0-10/"
          f tba-robots.txt "http://www.tba.art.bg/robots.txt"
          f tba-1.html "http://www.tba.art.bg/гняв___8075"
          f tba-2.html "http://www.tba.art.bg/мечтата-на-идиотката___6556"
          f tba-3.html "http://www.tba.art.bg/басейнът___5199"
          f zad-robots.txt "https://zadkanala.bg/robots.txt"
          f zad-1.html "https://zadkanala.bg/spektakli/velika"
          f zad-2.html "https://zadkanala.bg/spektakli/syn-v-zimna-nosht"
          f zad-3.html "https://zadkanala.bg/spektakli/pop-folk-hroniki-beli-ptitzi-i-kurshumi"
          f theatro-robots.txt "https://www.theatro.bg/robots.txt"
          f theatro-1.html "https://www.theatro.bg/portfolio_page/илюзии/"
          f theatro-2.html "https://www.theatro.bg/portfolio_page/сватба-със-закъснител/"
          f theatro-3.html "https://www.theatro.bg/portfolio_page/българската-литература-накратко/"
      - name: publish
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-out; git rm -rqf --cached .; git add -f out
          git commit -qm out; git push -f origin probe-out
