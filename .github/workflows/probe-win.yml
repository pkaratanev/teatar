name: Probe Windows bundle
on:
  push:
    branches: [probe-win]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: bundle
        working-directory: mobile
        run: |
          exec > ../probe.txt 2>&1
          node -v
          npm install --no-audit --no-fund 2>&1 | tail -5
          EXPO_PUBLIC_API_URL=http://localhost:8000/api/v1 CI=1 npx expo export --platform android --output-dir dist 2>&1 | head -80
          echo "--- start (dev server) ---"
          (CI=1 timeout 90 npx expo start --port 8081 > start.log 2>&1 &) ; sleep 45
          curl -s "http://localhost:8081/node_modules/expo-router/entry.bundle?platform=android&dev=true" | head -c 3000
          sleep 5; cat start.log | head -80
      - name: publish
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-out; git rm -rqf --cached .; git add -f probe.txt
          git commit -qm out; git push -f origin probe-out
